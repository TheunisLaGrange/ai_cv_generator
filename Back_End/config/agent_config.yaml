agent:
  name: "compliance_groq_agent"
  version: "1.0.0"

llm:
  planner_model: "gemma2-9b-it"   
  worker_model: "openai/gpt-oss-120b"    # 🌟 Updated to an active Groq open model
  temperature: 0.0

throttling:
  self_scheduling_delay: 2
  max_retries_per_step: 3

diagnostics:
  log_level: "DEBUG"
  enable_post_mortem: true

enforce_local_cache: false
